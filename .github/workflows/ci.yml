name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run tools:install
      - run: npm run check:luau
      - run: npm test
      - run: npm run test:integration
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        with:
          name: microbenchmarks
          path: .local/benchmarks.json
